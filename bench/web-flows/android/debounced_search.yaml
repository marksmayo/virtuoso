url: http://127.0.0.1:4280/e/debounced-search
name: Debounced Search
---
- launchApp:
    clearState: true
# Typed a key at a time, the results come after the debounce; a decoy is one character off.
# The Android field's copy of ../debounced_search.yaml: Chrome on Android shows a tool that reads
# its accessibility tree (Maestro, through Chrome the app) no data-testid, so the field is known
# by its placeholder.
- tapOn: Search snacks
- inputText: trail mix
- tapOn: Trail Mix 500 g
- assertVisible: Added Trail Mix 500 g to the cart
