# Text input: type into the search field, erase, type again.
appId: com.apple.Preferences
---
- launchApp
# iOS 26 puts Settings' search field at the bottom: the second "Search" on screen (the first
# is Settings' own Search row).
- tapOn:
    text: Search
    index: 1
- inputText: brightness level
- eraseText: 20
- inputText: dark mode
- hideKeyboard
