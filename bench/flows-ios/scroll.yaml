# Scrolling: down a long list for an element, into it, and back to the top.
appId: com.apple.Preferences
---
- launchApp
- scrollUntilVisible:
    element: Privacy & Security
    direction: DOWN
- tapOn: Privacy & Security
- assertVisible: Location Services
- swipe:
    start: 1%, 50%
    end: 80%, 50%
- scrollUntilVisible:
    element: General
    direction: UP
