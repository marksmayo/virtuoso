# Navigation: three screens one level down and back (iOS has no Back key: the back button,
# which a sub-screen of Settings labels "Settings").
appId: com.apple.Preferences
---
- launchApp
- tapOn: General
- assertVisible: About
- tapOn: Settings
- tapOn: Accessibility
- assertVisible: VoiceOver
- tapOn: Settings
- tapOn: Camera
- assertVisible: Record Video
- tapOn: Settings
- assertVisible: General
