# Navigation: screens one and two levels down and back (iOS has no Back key: the swipe in from
# the screen's left edge, which every tool can make). The simulator has no VoiceOver, so
# Accessibility is checked by what it does show.
appId: com.apple.Preferences
---
- launchApp
- tapOn: General
- assertVisible: About
- swipe:
    start: 1%, 50%
    end: 80%, 50%
- tapOn: Accessibility
- tapOn: Display & Text Size
- assertVisible: Bold Text
- swipe:
    start: 1%, 50%
    end: 80%, 50%
- swipe:
    start: 1%, 50%
    end: 80%, 50%
- assertVisible: General
