# Repeated taps: in and out of one screen five times (back by the swipe in from the left edge).
# Settings is a system app (see launch.yaml): the tap at General's point.
steps:
  - tool: restart-app
    args: { bundleId: com.apple.Preferences }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: General }, bundleId: com.apple.Preferences, timeoutMs: 15000 }
  - run: _general-and-back
  - run: _general-and-back
  - run: _general-and-back
  - run: _general-and-back
  - run: _general-and-back
