  # Below "$10": Argent's relations are in reading order, and the Choose right after "$10" is on
  # its own row (Plus's). The one after that, the next row's.
  - tap: { text: { matches: '^Choose$' }, after: { text: { matches: '^Choose$' }, after: { text: { matches: '^\$10$' } } } }
  - await: { visible: { text: 'Chose Pro' } }
  - tap: { text: { matches: '^Choose$' }, within: { id: 'plan-basic' } }
  - await: { visible: { text: 'Chose Basic' } }
  # "Basic" left of the first "Choose": before it in reading order.
  - await: { visible: { text: { matches: '^Choose$' }, after: { text: { matches: '^Basic$' } } } }
  # An element with a "Choose" child, the third: the Pro plan.
  - await: { visible: { text: { matches: '^Choose$' }, within: { id: 'plan-pro' } } }
  - await: { visible: { text: { matches: '^Plus$' }, within: { id: 'plan-plus' } } }
  - await: { visible: { text: { matches: '^\$10$' }, within: { id: 'plan-plus' } } }
  - tap: { text: { matches: '^Item$' }, after: { text: { matches: '^Item$' }, after: { text: { matches: '^Item$' }, after: { text: { matches: '^Item$' } } } } }
  - await: { visible: { text: 'Picked item 4' } }
  # "Item" above the index result: the first.
  - tap: { text: { matches: '^Item$' } }
  - await: { visible: { text: 'Picked item 1' } }
  - tap: { text: { matches: '^Open$' }, after: { text: { matches: '^States$' } } }
  - await: { visible: { text: 'Open was tapped' } }
  # (locked is disabled: Argent's selectors have no checked, selected or enabled state.)
  - tap: { id: 'locked' }
  - await: { hidden: { text: 'Locked was tapped' } }
  # (period-Week is selected, period-Day not: Argent's selectors have no checked, selected or enabled state.)
  # The period right of Week: the next one after it.
  - tap: { text: { matches: '^(Day|Week|Month|Year)$' }, next: { id: 'period-Week' } }
  # (period-Month is selected: Argent's selectors have no checked, selected or enabled state.)
  - await: { visible: { text: 'Showing: Month' } }
  # (notify-me is checked, hide-me not: Argent's selectors have no checked, selected or enabled state.)
  - tap: { id: 'hide-me' }
  # (hide-me is checked: Argent's selectors have no checked, selected or enabled state.)
  - scroll-to: { target: { id: 'focus-field' }, direction: up }
  - tap: { id: 'focus-field' }
  # (focus-field has focus: Argent's selectors have no checked, selected or enabled state.)
  - tool: button
    args: { button: back }
  - scroll-to: { target: { id: 'slow-button' }, direction: down }
  - tap: { id: 'slow-button' }
  - await: { visible: { text: 'Slow button: done' }, timeout: 5000 }
  - when: { visible: { text: 'Not on this screen' } }
    steps:
      - tap: { text: 'Not on this screen' }
  # The step's label ("The square box shows") names it in Maestro's report: no selector.
  - await: { visible: { id: 'box-square' } }
