[workspace]
resolver = "2"
members = ["crates/virtuoso", "crates/virtuoso-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
# Size over speed: the time a run takes is the device's, not this code's (host CPU is
# milliseconds a flow). "z" saves ~550 KB against 3.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# QuickJS (C) runs a flow's `${...}` and scripts, never in a hot loop: compiled for size.
[profile.release.package.rquickjs-sys]
opt-level = "s"
