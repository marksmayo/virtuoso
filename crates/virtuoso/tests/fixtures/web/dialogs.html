<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dialogs</title>
<style>body{font:16px system-ui;margin:16px} button,a{display:block;margin:6px 0;padding:6px;width:240px}</style></head>
<body>
<!-- The browser's own dialogs, and a link and a script that open a second tab. -->
<button id="alert" onclick="alert('Saved!'); out('Alert closed')">Alert</button>
<button id="confirm" onclick="out(confirm('Delete the draft?') ? 'Confirmed' : 'Cancelled')">Confirm</button>
<button id="prompt" onclick="out('Hello ' + prompt('Your name?', ''))">Prompt</button>
<a id="newtab" href="second.html" target="_blank">Open a new tab</a>
<button id="popup" onclick="window.open('second.html', '_blank')">Open a popup</button>
<button id="slowpopup" onclick="window.open('slow?ms=1500', '_blank')">Open a slow popup</button>
<p id="out">Nothing yet</p>
<script>function out(t) { document.getElementById('out').textContent = t }</script>
</body></html>
