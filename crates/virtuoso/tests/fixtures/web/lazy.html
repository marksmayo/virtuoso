<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lazy</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #box { height: 600px; overflow: auto; margin: 100px 40px 0; border: 1px solid #999; }
  .row { height: 40px; }
</style>
</head>
<body>
<!-- A feed that loads its next rows 300 ms after a scroll nears its end, 40 at a time, up to
     row 400: the Last row is only there once the scroll has waited for each load. -->
<div id="box"></div>
<script>
  const box = document.getElementById('box');
  let n = 0, loading = false;
  const more = () => {
    for (let i = 0; i < 40 && n < 400; i++) {
      n++;
      const d = document.createElement('div');
      d.className = 'row';
      d.textContent = n === 400 ? 'Last row' : 'Row ' + n;
      box.appendChild(d);
    }
  };
  more();
  box.addEventListener('scroll', () => {
    if (loading || n >= 400 || box.scrollTop + box.clientHeight < box.scrollHeight - 100) return;
    loading = true;
    setTimeout(() => { more(); loading = false; }, 300);
  });
</script>
</body>
</html>
