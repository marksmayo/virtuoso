<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Virtual</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #box { height: 480px; overflow: auto; position: relative; margin: 40px; border: 1px solid #999; }
  #tall { height: 36000px; position: relative; }
  .row { position: absolute; left: 0; right: 0; height: 36px; }
</style>
</head>
<body>
<!-- A virtualized table: only the rows in view exist (and ?overscan=N more beyond each edge, as
     list libraries keep), and those a scroll brings in are drawn in a task of their own after the
     scroll's frame (a posted message, as React's scheduler renders a state set in a scroll
     handler). ?alternate=1: the rows kept above the box come and go from one scroll to the next
     (as lists that keep more ahead of the scroll than behind it). What the page saw: `wheels`, and
     `drawn`, every row ever in the page. -->
<div id="box"><div id="tall"></div></div>
<script>
  const box = document.getElementById('box'), tall = document.getElementById('tall');
  const q = new URLSearchParams(location.search), over = +(q.get('overscan') || 0), alternate = q.get('alternate') === '1';
  window.wheels = 0;
  window.drawn = new Set();
  box.addEventListener('wheel', () => window.wheels++);
  window.touches = 0;
  box.addEventListener('touchstart', () => window.touches++);
  // Each time the box comes to rest after a scroll (a scroll event with none within 30 ms).
  window.landings = 0; let rest = 0;
  box.addEventListener('scroll', () => { clearTimeout(rest); rest = setTimeout(() => window.landings++, 30); });
  let draws = 0;
  const draw = () => {
    draws++;
    const above = alternate && draws % 2 === 0 ? 0 : over;
    const first = Math.max(0, Math.floor(box.scrollTop / 36) - above), last = Math.ceil((box.scrollTop + 480) / 36) + over;
    tall.textContent = '';
    for (let i = first; i < last && i < 1000; i++) {
      const d = document.createElement('div');
      d.className = 'row';
      d.style.top = i * 36 + 'px';
      d.textContent = 'Row ' + i;
      tall.appendChild(d);
      window.drawn.add(i);
    }
  };
  const later = new MessageChannel();
  later.port1.onmessage = draw;
  box.addEventListener('scroll', () => later.port2.postMessage(null));
  draw();
</script>
</body>
</html>
