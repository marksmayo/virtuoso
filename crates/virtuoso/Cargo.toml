[package]
name = "virtuoso"
description = "A fast Maestro-compatible end-to-end test runner for mobile apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "virtuoso"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
png = "0.17"
rquickjs = { version = "0.9", default-features = false, features = ["classes", "properties"] }
# Selectors need lookarounds, backreferences, case folding, word classes and word boundaries:
# the rest of the regex engine's Unicode tables and prefilters (~600 KB) are left out.
# unicode-word-boundary must stay: without it fancy-regex panics on a word-boundary pattern.
fancy-regex = { version = "0.19", default-features = false, features = ["std"] }
regex-automata = { version = "0.4", default-features = false, features = ["unicode-case", "unicode-perl", "unicode-word-boundary"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader"] }
