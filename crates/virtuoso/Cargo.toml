[package]
name = "virtuoso"
description = "A fast Maestro-compatible end-to-end test runner for mobile apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "virtuoso"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
png = "0.17"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rquickjs = { version = "0.9", default-features = false, features = ["classes", "properties"] }
fancy-regex = "0.14"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader"] }
