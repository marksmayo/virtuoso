name: ios-bench

# The iOS benchmark on GitHub's macOS runners: one job per group of scenarios, each on its own
# booted simulator with every tool taking turns on it, then one report from all. The tools
# that run Maestro flows first; Appium, e2e and Argent once their tests have iOS versions.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Recorded runs per tool and scenario
        default: "5"
      only:
        description: "Scenario groups to run (separated by ';'); empty for all"
        default: ""
      tools:
        description: "Tools to run (comma-separated); empty for the default set"
        default: ""
      trace:
        description: "Each tool prints where its time goes (speedrun's SPEEDRUN_DEBUG, virtuoso's VIRTUOSO_IOS_TRACE): for comparing, not for the results"
        type: boolean
        default: false

env:
  TAM_COMMIT: f4be1c456858b6c8bd4839053f5e267f75c937d8
  SPEEDRUN_APP: speedrun-bench-c2bd948be9b6-ios-simulator.zip
  # The default set; Argent and Appium are dispatched on their own (tools input).
  TOOLS: virtuoso,speedrun,maestro-runner,maestro,e2e
  # The same toolchain, Xcode and simulator runtime for every job and every batch: a runner
  # image update otherwise changes them between batches that are compared.
  RUST_TOOLCHAIN: "1.99.1"
  XCODE: /Applications/Xcode_16.4.app
  IOS_RUNTIME: "26.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      tools: ${{ steps.groups.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hubastard/speedrun
          ref: v0.2.11
          path: speedrun
      - id: groups
        run: |
          {
            echo "launch,navigate,scroll,input,assertions,taps,trivial,invalid"
            # config.yaml is the folder's workspace config, not a flow.
            for f in speedrun/bench/app/flows/*.yaml; do n=$(basename "$f" .yaml); [ "$n" = config ] || echo "app/$n"; done
            for f in bench/tam-flows/*.yaml; do echo "tam/$(basename "$f" .yaml)"; done
          } > groups.txt
          only="${{ inputs.only }}"
          if [ -n "$only" ]; then echo "$only" | tr ';' '\n' > groups.txt; fi
          echo "groups=$(jq -R . groups.txt | jq -cs .)" >> "$GITHUB_OUTPUT"
          tools="${{ inputs.tools }}"
          echo "tools=${tools:-$TOOLS}" >> "$GITHUB_OUTPUT"
          cat groups.txt

  # The benchmark apps for the simulator: speedrun's from its release, Tester Army's built.
  apps:
    runs-on: macos-15
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: apps
          key: ios-apps-${{ env.TAM_COMMIT }}-${{ env.SPEEDRUN_APP }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: tester-army/e2e
          ref: ${{ env.TAM_COMMIT }}
          path: e2e
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the tester-army benchmark app for the simulator
        working-directory: e2e
        run: |
          # Its Swift packages need Swift 6.2: the newest Xcode on the runner (26), not its default.
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          corepack enable
          pnpm install --frozen-lockfile
          cd apps/mobile-benchmark
          CI=1 npx expo prebuild --platform ios
          cd ios
          ws=$(ls -d *.xcworkspace | head -1)
          scheme=$(basename "$ws" .xcworkspace)
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
          mkdir -p "$GITHUB_WORKSPACE/apps"
          cp -R "$(find build/Build/Products -name '*.app' -maxdepth 2 | head -1)" "$GITHUB_WORKSPACE/apps/mobile-benchmark.app"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: speedrun's benchmark app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bench-app -R hubastard/speedrun -p "$SPEEDRUN_APP" -O "$RUNNER_TEMP/speedrun.zip"
          mkdir -p apps/speedrun && unzip -q "$RUNNER_TEMP/speedrun.zip" -d apps/speedrun
          mv "$(find apps/speedrun -name '*.app' -maxdepth 3 | head -1)" apps/speedrun-bench.app
          rm -rf apps/speedrun
      - name: Pack (an .app is a folder)
        run: tar czf ios-apps.tgz apps
      - uses: actions/upload-artifact@v4
        with:
          name: ios-apps
          path: ios-apps.tgz
          # Gzipped already.
          compression-level: 0

  # virtuoso and the harness, built once for every bench job (each built both for minutes).
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # No ANDROID_HOME: the Android agent is not built into an iOS run's binary.
      - run: |
          ANDROID_HOME= ANDROID_SDK_ROOT= cargo build --release -p virtuoso
          ANDROID_HOME= ANDROID_SDK_ROOT= cargo build --profile harness -p virtuoso-bench
          mkdir -p bin && cp target/release/virtuoso target/harness/virtuoso-bench bin/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: bin

  bench:
    needs: [plan, apps, build]
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Every macOS runner the account has (5): seven tools on 43 groups take most of a day.
      max-parallel: 5
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    env:
      VIRTUOSO_BENCH_APP_FLOWS: ${{ github.workspace }}/speedrun/bench/app/flows
      VIRTUOSO_BENCH_HOST: "GitHub macos-15 runner (Apple Silicon, 3 vCPU, 7 GB)"
      BENCH_TOOLS: ${{ needs.plan.outputs.tools }}
    steps:
      # Booting takes a minute or more: started first, waited for once the rest is set up.
      - name: Xcode, and a simulator booting
        run: |
          # Spotlight indexing on the Mac takes CPU from whichever tool runs while it does.
          sudo mdutil -a -i off >/dev/null || true
          if [ -d "$XCODE" ]; then sudo xcode-select -s "$XCODE"; else echo "::warning::$XCODE is not on this image: $(xcode-select -p)"; fi
          xcodebuild -version
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          runtime=$(xcrun simctl list runtimes -j | jq -r --arg v "$IOS_RUNTIME" '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] as $r | ([$r[] | select(.version == $v)] | first) // ($r | last)')
          rid=$(echo "$runtime" | jq -r .identifier)
          dtype=$(echo "$runtime" | jq -r '[.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))] | last | .identifier')
          udid=$(xcrun simctl create bench "$dtype" "$rid")
          xcrun simctl boot "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          echo "Booting $dtype on $rid: $udid"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hubastard/speedrun
          ref: v0.2.11
          path: speedrun
      - uses: actions/download-artifact@v4
        with:
          name: ios-apps
      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: target/release
      - run: chmod +x target/release/virtuoso target/release/virtuoso-bench
      - if: contains(format(',{0},', env.BENCH_TOOLS), ',maestro,')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bench/*/package-lock.json
      # Maestro, maestro-runner and speedrun from their releases, once: GitHub's release
      # downloads time out on and off.
      - uses: actions/cache@v4
        with:
          path: |
            bench/tools/maestro-2.11.0
            bench/tools/maestro-runner-dist
            bench/tools/speedrun
          key: macos-tools-maestro-2.11.0-runner-1.1.29-speedrun-0.2.11
      # virtuoso's iOS agent, built once per agent source and Xcode (each job built it, a minute).
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/virtuoso
          key: ios-agent-${{ hashFiles('agent/ios/**') }}-xcode16.4
      - name: The competitors
        run: bash bench/ci/setup-macos.sh
      - name: Install the apps, once the simulator is up and quiet
        run: |
          xcrun simctl bootstatus "$UDID" -b
          tar xzf ios-apps.tgz
          xcrun simctl install "$UDID" apps/speedrun-bench.app
          xcrun simctl install "$UDID" apps/mobile-benchmark.app
          # A simulator just booted indexes and installs for a while: the first tool's runs
          # would pay for it. Up to a minute for the Mac to be mostly idle twice in a row.
          quiet=0
          for i in $(seq 1 30); do
            idle=$(top -l 2 -n 0 -s 1 | grep "CPU usage" | tail -1 | sed -E 's/.* ([0-9.]+)% idle.*/\1/')
            if [ "${idle%.*}" -ge 70 ]; then quiet=$((quiet + 1)); else quiet=0; fi
            [ "$quiet" -ge 2 ] && break
          done
          echo "Mac idle ${idle}% after ${i} checks"
      - name: Run
        run: |
          version_runs=0
          case "${{ matrix.group }}" in *launch*) version_runs=10 ;; esac
          if [ "${{ inputs.trace }}" = "true" ]; then export SPEEDRUN_DEBUG=1 VIRTUOSO_IOS_TRACE=1; fi
          target/release/virtuoso-bench run --platform ios --device "$UDID" --tools "$BENCH_TOOLS" \
            --scenarios "${{ matrix.group }}" --iterations "${{ inputs.iterations }}" \
            --version-runs "$version_runs" --out results.json --outputs outputs
      - name: Name the results
        if: always()
        run: |
          name=$(echo "${{ matrix.group }}" | tr '/,' '__' | cut -c1-60)
          echo "RESULT_NAME=$name" >> "$GITHUB_ENV"
          [ -f results.json ] && mv results.json "results-$name.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ env.RESULT_NAME }}
          path: results-*.json
          if-no-files-found: ignore
      # Every run's whole output: why one failed, and where the time went.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs-${{ env.RESULT_NAME }}
          path: outputs
          if-no-files-found: ignore

  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # Merging JSON and writing a page: a debug build does it as well, minutes sooner.
      - run: ANDROID_HOME= cargo build -p virtuoso-bench
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Merge and report
        run: |
          target/debug/virtuoso-bench merge ios.json results/*.json
          target/debug/virtuoso-bench report ios.json --no-readme --out report/ios.html
      - uses: actions/upload-artifact@v4
        with:
          name: ios-report
          path: |
            ios.json
            report/ios.html
