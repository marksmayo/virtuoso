name: web

# The web device tests: a real headless Chrome (preinstalled on every GitHub runner) on Linux,
# Windows and macOS. Minutes, not an emulator's hours. And again on Chrome's headless shell (the
# old headless mode, a lighter binary of its own), which a headless launch drives when one of
# Chrome's version is installed beside it: every test has to pass on it too.
on:
  push:
    branches: [main, web]
    paths: ['crates/virtuoso/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['crates/virtuoso/**', '.github/workflows/web.yml']
  workflow_dispatch:

# A push's run finishes (Windows' cold build is the slowest job, and a cancelled run tells
# nothing); a pull request's newer push replaces its older run.
concurrency:
  group: web-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The headless shell's leg: Chrome for Testing and its headless shell, both of this version.
  CHROME_VERSION: "158.0.8127.88"

jobs:
  chrome:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The runner's Chrome; or Chrome for Testing with its headless shell beside it.
        browser: [chrome, headless-shell]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A web recording is Chrome's screencast made a video by ffmpeg: apt's on Linux (the setup
      # action's download failed there once), the action's on Windows, Homebrew's on macOS (the
      # action has no Apple-silicon build).
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        # The package lists first: an image's own can name packages the mirror has dropped (404s).
        run: |
          apt="sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=2"
          $apt update -qq || echo "the package lists could not all be refreshed: installing from those there are"
          $apt install -y -qq --no-install-recommends ffmpeg > /dev/null
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os == 'Windows'
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet ffmpeg
      # Which Chrome the tests drive. On Windows `chrome.exe --version` opens the browser and
      # never returns: the version is the file's.
      - name: Chrome
        if: matrix.browser == 'chrome'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) google-chrome --version ;;
            Windows) powershell -NoProfile -Command "(Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.ProductVersion" ;;
            macOS) "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version ;;
          esac
      - uses: actions/setup-node@v4
        if: matrix.browser == 'headless-shell'
        with:
          node-version: 22
      # Chrome for Testing and its headless shell, as puppeteer installs them (each in a folder
      # of its platform and version, side by side): VIRTUOSO_CHROME names Chrome, and virtuoso
      # finds the shell beside it, as it would on a machine set up this way.
      - name: Chrome for Testing and its headless shell
        if: matrix.browser == 'headless-shell'
        shell: bash
        run: |
          install() { npx -y @puppeteer/browsers@3.2.6 install "$1@$CHROME_VERSION" --path "$RUNNER_TEMP/cft" | tail -n1 | cut -d' ' -f2-; }
          chrome=$(install chrome)
          shell=$(install chrome-headless-shell)
          echo "Chrome: $chrome"
          echo "Headless shell: $shell"
          test -f "$chrome" && test -f "$shell"
          echo "VIRTUOSO_CHROME=$chrome" >> "$GITHUB_ENV"
      # Ubuntu 24.04 lets only the browsers its AppArmor profiles name make the user namespaces
      # Chrome's sandbox needs: Chrome for Testing (and its shell) abort at launch without this.
      - name: Chrome's sandbox (Linux)
        if: matrix.browser == 'headless-shell' && runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Web tests
        env:
          VIRTUOSO_WEB: "1"
          # The shell's leg: the test that it is the shell a launch drives fails if none is found.
          VIRTUOSO_WEB_SHELL: ${{ matrix.browser == 'headless-shell' && '1' || '' }}
          # The Android agent is not built into these tests' binary.
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: cargo test -p virtuoso --test device_web -- --test-threads=1

  # The same web tests on Firefox (the pinned release, over WebDriver BiDi), one at a time:
  # Firefoxes started side by side were slow to open their sessions. Chrome's own tests (its
  # switches, its processes) are skipped there; Firefox's own run as well.
  firefox:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "161.0"
      - name: Firefox
        shell: bash
        run: echo "Firefox at ${{ steps.firefox.outputs.firefox-path }}"
      - name: Web tests on Firefox
        env:
          VIRTUOSO_WEB: "1"
          VIRTUOSO_WEB_BROWSER: firefox
          VIRTUOSO_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          VIRTUOSO_FIREFOX_LOG: ${{ runner.temp }}/firefox-logs
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: cargo test -p virtuoso --test device_web --test device_firefox -- --test-threads=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/firefox-logs
