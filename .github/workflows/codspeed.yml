name: codspeed

# Host-side benchmarks (crates/virtuoso/benches) under CodSpeed's CPU simulation: flow parsing,
# screen replies, selectors, `${...}` expansion and screenshot pixels. No device needed.
on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to build initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain, cache and cargo-codspeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - name: Build the benchmarks
        run: cargo codspeed build -m simulation -p virtuoso
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p virtuoso
