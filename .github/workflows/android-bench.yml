name: android-bench

# The Android benchmark on GitHub's Linux runners: one job per group of scenarios, each on its
# own KVM-accelerated emulator with every tool taking turns on it, then one report from all.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Recorded runs per tool and scenario
        default: "5"
      only:
        description: "Scenario groups to run (separated by ';', as the matrix names them); empty for all"
        default: ""
      tools:
        description: "Tools to run (comma-separated); empty for all"
        default: ""

env:
  # The tester-army benchmark app, built from this commit of tester-army/e2e.
  TAM_COMMIT: f4be1c456858b6c8bd4839053f5e267f75c937d8
  # speedrun's benchmark app for speedrun v0.2.11 (bench/app/bench.sh hash in that checkout).
  SPEEDRUN_APP: speedrun-bench-c2bd948be9b6.apk

jobs:
  # Which jobs: the Settings scenarios together, then each benchmark app flow on its own.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      # Its flows folder alone: all a job reads of speedrun's repository (VIRTUOSO_BENCH_APP_FLOWS).
      - uses: actions/checkout@v4
        with:
          repository: hubastard/speedrun
          ref: v0.2.11
          path: speedrun
          sparse-checkout: bench/app/flows
          sparse-checkout-cone-mode: true
      - id: groups
        run: |
          {
            echo "launch,navigate,scroll,input,assertions,taps,trivial,invalid"
            # config.yaml is the folder's workspace config, not a flow.
            for f in speedrun/bench/app/flows/*.yaml; do n=$(basename "$f" .yaml); [ "$n" = config ] || echo "app/$n"; done
            for f in bench/tam-flows/*.yaml; do echo "tam/$(basename "$f" .yaml)"; done
          } > groups.txt
          # The longest jobs first (each group's minutes in the last full run: minutes-android.txt),
          # and the app flows of 35 minutes or less two or three to a job of up to 75 (the job
          # limit is 300). The groups `only` names run as named, longest first.
          pack="35 75"
          only="${{ inputs.only }}"
          if [ -n "$only" ]; then echo "$only" | tr ';' '\n' > groups.txt; pack=""; fi
          bash bench/ci/plan.sh bench/ci/minutes-android.txt $pack < groups.txt > matrix.txt
          echo "groups=$(jq -R . matrix.txt | jq -cs .)" >> "$GITHUB_OUTPUT"
          cat matrix.txt

  apps:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: apps
          key: android-apps-${{ env.TAM_COMMIT }}-${{ env.SPEEDRUN_APP }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: tester-army/e2e
          ref: ${{ env.TAM_COMMIT }}
          path: e2e
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # On a miss, its dependencies (pnpm's store, Gradle's downloads) from the last build's
      # cache: only what is downloaded. The pinned commit and lockfile give the same app.
      - if: steps.cache.outputs.cache-hit != 'true'
        id: pnpm
        working-directory: e2e
        run: |
          corepack enable
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm.outputs.store }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-app-deps-linux-${{ env.TAM_COMMIT }}
          restore-keys: android-app-deps-linux-
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the tester-army benchmark app
        working-directory: e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          cd apps/mobile-benchmark
          CI=1 npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -q
          mkdir -p "$GITHUB_WORKSPACE/apps"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apps/mobile-benchmark.apk"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: speedrun's benchmark app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download bench-app -R hubastard/speedrun -p "$SPEEDRUN_APP" -O apps/speedrun-bench.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: apps
          # APKs are zip archives already.
          compression-level: 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The harness only starts and times processes: the harness profile (no LTO), minutes
      # sooner for every bench job. virtuoso, which is measured, stays on release.
      - run: |
          cargo build --release -p virtuoso
          cargo build --profile harness -p virtuoso-bench
          mkdir -p bin && cp target/release/virtuoso target/harness/virtuoso-bench bin/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin

  bench:
    needs: [plan, apps, build]
    runs-on: ubuntu-latest
    # Seven tools on app/animations take over three hours.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Room left for the other workflows: an account runs 20 jobs at once (5 on macOS).
      max-parallel: 14
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    env:
      # The tools to set up (setup-linux.sh): those of the tools input; all when empty.
      BENCH_TOOLS: ${{ inputs.tools }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hubastard/speedrun
          ref: v0.2.11
          path: speedrun
          sparse-checkout: bench/app/flows
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: android-apps
          path: ${{ runner.temp }}/apps
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # npm's cache holds only the packages' tarballs: the trees installed are the same.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bench/appium/package-lock.json
            bench/e2e/package.json
            bench/argent/package.json
      # Maestro, maestro-runner and speedrun from their releases, once: GitHub's release
      # downloads time out on and off.
      - uses: actions/cache@v4
        with:
          path: |
            bench/tools/maestro-2.11.0
            bench/tools/maestro-runner-dist
            bench/tools/speedrun
          key: linux-tools-maestro-2.11.0-runner-1.1.29-speedrun-0.2.11
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The competitors are set up while the emulator boots (the two are independent): in the
      # background, the environment they need, their output and exit status into files that
      # run-android.sh waits for.
      - name: The competitors, in the background
        run: |
          nohup bash -c 'GITHUB_ENV="$RUNNER_TEMP/setup.env" bash bench/ci/setup-linux.sh; echo $? > "$RUNNER_TEMP/setup.status"' > "$RUNNER_TEMP/setup.log" 2>&1 < /dev/null &
      # The system image (~1.5 GB from sdkmanager a job) from the cache, keyed on the revision
      # sdkmanager installs now: the action's sdkmanager then finds it installed. Still
      # cold-booted (-no-snapshot): only the download goes.
      - name: The system image's revision
        id: sdk
        run: |
          rev=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | awk -F'|' '/Available Packages:/ { a = 1; next } a { gsub(/ /, "", $1); gsub(/ /, "", $2) } a && $1 == "system-images;android-36;google_apis;x86_64" { print $2; exit }' || true)
          echo "dir=$ANDROID_HOME/system-images/android-36/google_apis/x86_64" >> "$GITHUB_OUTPUT"
          # Unknown, no key: no cache, sdkmanager as before.
          if [ -n "$rev" ]; then echo "key=android-image-linux-android-36-google_apis-x86_64-r$rev" >> "$GITHUB_OUTPUT"; else echo "::warning::sdkmanager --list named no revision of the system image: not cached"; fi
          echo "system image revision: $rev"
      - if: steps.sdk.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.dir }}
          key: ${{ steps.sdk.outputs.key }}
      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VIRTUOSO_BENCH_APP_FLOWS: ${{ github.workspace }}/speedrun/bench/app/flows
          VIRTUOSO_BENCH_HOST: "GitHub ubuntu-latest runner (4 vCPU, 16 GB), Android emulator on KVM"
          VIRTUOSO_BENCH_GPU: software GPU (SwiftShader)
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # gRPC on: Argent's simulator-server finds a running emulator by its gRPC endpoint.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -grpc 8554
          disable-animations: false
          script: bash bench/ci/run-android.sh "${{ matrix.group }}" "${{ inputs.iterations }}" "${{ inputs.tools }}"
      - name: Name the results
        if: always()
        run: |
          name=$(echo "${{ matrix.group }}" | tr '/,' '__' | cut -c1-60)
          echo "RESULT_NAME=$name" >> "$GITHUB_ENV"
          [ -f results.json ] && mv results.json "results-$name.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ env.RESULT_NAME }}
          path: results-*.json
          if-no-files-found: ignore
      # Each run's whole output, for why one failed (the results keep only its last lines).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs-${{ env.RESULT_NAME }}
          path: outputs
          if-no-files-found: ignore
      # virtuoso's debug folders (~/.virtuoso/tests: a failed flow's screenshot and screen, and
      # what a flow saved), without videos, kept a week.
      - name: virtuoso's debug folders
        if: always()
        continue-on-error: true
        run: if [ -d ~/.virtuoso/tests ]; then rsync -a --exclude '*.mp4' ~/.virtuoso/tests/ virtuoso-debug/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ env.RESULT_NAME }}
          path: virtuoso-debug
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Merge and report
        run: |
          chmod +x target/release/virtuoso-bench
          target/release/virtuoso-bench merge android.json results/*.json
          target/release/virtuoso-bench report android.json --no-readme --out report/android.html
      - uses: actions/upload-artifact@v4
        with:
          name: android-report
          path: |
            android.json
            report/android.html
