name: ios

# The iOS agent and device tests on a simulator: macOS runners are free for public repos.
on:
  push:
    branches: [main, ios]
    paths: ['agent/ios/**', 'crates/virtuoso/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen

      - name: Boot a simulator
        run: |
          # The software keyboard, as on a phone: with the Mac's keyboard connected it never shows.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last')
          rid=$(echo "$runtime" | jq -r .identifier)
          dtype=$(echo "$runtime" | jq -r '[.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))] | last | .identifier')
          udid=$(xcrun simctl create virtuoso "$dtype" "$rid")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "UDID=$udid" >> "$GITHUB_ENV"
          echo "Booted $dtype on $rid: $udid"

      # The tests run on the project generated from project.yml; a committed project that no
      # longer matches it fails the job at the end, and the generated one is uploaded to commit.
      - name: Generate the Xcode project
        working-directory: agent/ios
        run: |
          cp -R VirtuosoAgent.xcodeproj "$RUNNER_TEMP/committed.xcodeproj"
          xcodegen generate
          if ! diff -r "$RUNNER_TEMP/committed.xcodeproj" VirtuosoAgent.xcodeproj; then
            echo "PROJECT_STALE=1" >> "$GITHUB_ENV"
          fi

      - name: The generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: agent/ios/VirtuosoAgent.xcodeproj

      - name: Build the fixture app
        working-directory: agent/ios
        run: |
          xcodebuild build -project VirtuosoAgent.xcodeproj -scheme VirtuosoFixture -destination "id=$UDID"             -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/VirtuosoFixture.app

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: iOS tests
        env:
          VIRTUOSO_IOS_DEVICE: ${{ env.UDID }}
          # No VIRTUOSO_IOS_AGENT: virtuoso builds the agent it carries, as on a user's Mac.
          # The agent's log goes to the temp folder: one the artifact step can find.
          TMPDIR: ${{ runner.temp }}
        # One agent at a time: the tests share the simulator. The device tests' agent outlives
        # their process (it is shared by them all), so it is stopped before the flows start one.
        run: |
          status=0
          cargo test -p virtuoso --test ios_unit --test device_ios -- --test-threads=1 || status=1
          pkill -f test-without-building || true
          sleep 5
          cargo test -p virtuoso --test ios_flows -- --test-threads=1 || status=1
          exit $status

      - name: Agent logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-agent-logs
          path: |
            ${{ runner.temp }}/virtuoso-ios-agent-*.log
            ${{ runner.temp }}/ios-*.png
            ${{ runner.temp }}/ios-flows-output
          if-no-files-found: ignore

      - name: The committed Xcode project matches project.yml
        if: always()
        run: |
          if [ -n "$PROJECT_STALE" ]; then
            echo "::error::agent/ios/VirtuosoAgent.xcodeproj is not what project.yml generates: commit the xcodeproj artifact"
            exit 1
          fi
