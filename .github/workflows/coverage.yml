name: coverage

# Test coverage, on every pull request and every push to main, on Linux: the workspace's tests,
# then the real-Chrome web tests (Chrome is preinstalled on the runner). Two checks:
# - the lines a pull request adds or changes are at least 95% covered (diff-cover);
# - the repo's line coverage does not fall below the floor in .github/coverage-floor, which is
#   raised as coverage climbs toward 95% (a ratchet: never lowered).
# The Android and iOS device back ends need a device, so their device tests do not run here.
# A release build: the tests that hold code to a speed fail in an instrumented debug build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
      # A web recording is Chrome's screencast made a video by ffmpeg.
      # Twice it hung for the whole step: apt waiting on dpkg's lock while the runner's own
      # updates held it. The lock is waited for a while, and the package lists are fresh.
      # (The runner's sudo no longer takes -E, which it ignores with a warning: apt was then run
      # without DEBIAN_FRONTEND, asked a question nobody answers, and the step timed out. The
      # variable is given to apt itself.)
      - name: ffmpeg
        timeout-minutes: 10
        # A mirror that does not answer is given 30 s, twice, over IPv4 (the step sat silent for
        # its whole 10 minutes), and what apt says is shown, to tell where it stops if it does.
        run: |
          apt="sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          $apt update || echo "the package lists could not all be refreshed: installing from those there are"
          $apt install -y --no-install-recommends ffmpeg | tail -5
      - name: Tests
        # Not the tests of how the release binary is packaged (size, stripping, static linking):
        # instrumentation changes the binary they look at (they check a plain release build:
        # `cargo test --release -p virtuoso --test size`). Nor a test of how fast a decode is:
        # instrumented code is slower (the plain test jobs time it).
        run: |
          cargo llvm-cov --no-report --release --workspace -- --exact \
            --skip release::the_binary_fits_its_budget --skip release::no_name_resolver_is_linked \
            --skip linux::unwind_tables_are_stripped --skip linux::no_notes_comments_or_build_id \
            --skip linux::panic_messages_carry_no_build_paths --skip linux::the_release_is_static \
            --skip a_full_screen_screenshot_decodes_quickly
      - name: Web tests
        env:
          VIRTUOSO_WEB: "1"
        run: cargo llvm-cov --no-report --release -p virtuoso --test device_web -- --test-threads=1
      # The web tests on Firefox count too: its WebDriver BiDi path is only run there.
      - id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "161.0"
      - name: Web tests on Firefox
        env:
          VIRTUOSO_WEB: "1"
          VIRTUOSO_WEB_BROWSER: firefox
          VIRTUOSO_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: cargo llvm-cov --no-report --release -p virtuoso --test device_web --test device_firefox -- --test-threads=1
      - name: Report
        run: |
          cargo llvm-cov report --release --summary-only
          cargo llvm-cov report --release --lcov --output-path lcov.info
          cargo llvm-cov report --release --json --summary-only --output-path summary.json
      - name: The repo's coverage is not below its floor
        run: |
          total=$(jq '.data[0].totals.lines.percent' summary.json)
          floor=$(tr -d '[:space:]' < .github/coverage-floor)
          echo "Line coverage: ${total}% (floor ${floor}%, target 95%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t + 0 >= f + 0) }' || {
            echo "::error::Line coverage ${total}% is below the floor of ${floor}% (.github/coverage-floor)"
            exit 1
          }
      - name: The pull request's own lines are 95% covered
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet diff-cover==9.2.0
          diff-cover lcov.info --compare-branch="origin/${{ github.base_ref }}" --fail-under=95
